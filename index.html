function symptoms(d){const painVals=[[0,'۰—بدون'],[1,'۱—خفیف'],[2,'۲—متوسط'],[3,'۳—شدید']];return `<div class="card section"><div class="section-head"><h2>۱. وضعیت بدن و علائم</h2><small>قبل و بعد هر جلسه ثبت کنید</small></div><div class="formgrid">${inputSmall('درد قبل (۰–۱۰)','prePain',d.prePain,0,10,'data-draft="prePain"')}${inputSmall('درد بعد (۰–۱۰)','postPain',d.postPain,0,10,'data-draft="postPain"')}${inputSmall('بیداری شب قبل از گزگز','sleepWakes',d.sleepWakes,0,20,'data-draft="sleepWakes"')}${inputSmall('شدت جلسه RPE (۰–۱۰)','rpe',d.rpe,0,10,'data-draft="rpe"')}</div><div class="formgrid">${sel('گزگز دست راست قبل','preRight',d.preRight,painVals)}${sel('گزگز دست راست بعد','postRight',d.postRight,painVals)}${sel('گزگز دست چپ قبل','preLeft',d.preLeft,painVals)}${sel('گزگز دست چپ بعد','postLeft',d.postLeft,painVals)}</div><div class="mini-title">غربالگری تغییرات عصبی</div><label class="checkline"><input type="checkbox" data-draft="tingleWorse" ${d.tingleWorse?'checked':''}><span>حین تمرین گزگز یا بی‌حسی جدید/بدتر شده است</span></label><label class="checkline"><input type="checkbox" data-draft="neuroNew" ${d.neuroNew?'checked':''}><span>ضعف واقعی جدید یا پیشرونده در دست یا پا</span></label><label class="checkline"><input type="checkbox" data-draft="handTrouble" ${d.handTrouble?'checked':''}><span>مشکل جدید در دکمه بستن، نوشتن، گرفتن اشیا یا هماهنگی دست</span></label><label class="checkline"><input type="checkbox" data-draft="gait" ${d.gait?'checked':''}><span>اختلال جدید در تعادل یا راه‌رفتن</span></label><label class="checkline"><input type="checkbox" data-draft="bladder" ${d.bladder?'checked':''}><span>اختلال جدید کنترل ادرار/مدفوع یا مشکل غیرمعمول تخلیه</span></label><div id="statusArea">${safetyAlert(d)}</div></div>`}
function safetyAlert(d){const s=calcStatus(d);return'<div class="alert '+s.status+'" style="margin:12px 0 0"><span class="alert-icon">'+(s.status==='danger'?'⛔':s.status==='warning'?'⚠':'ⓘ')+'</span><div><strong>'+s.label+'</strong><span>'+s.hint+'</span></div></div>'}
function setHtml(eid,i,d,locked=false){const v=d.sets[eid+'_'+i]||{done:false,reps:'',weight:'',band:''},t=trackFor(eid);const duration=t.metric==='seconds';const metricLabel=duration?'زمان (ثانیه)':'تکرار واقعی';let extra='';if(t.load==='kg')extra='<td><input aria-label="وزنه کیلوگرم ست '+(i+1)+'" data-set="'+eid+'_'+i+'" data-sfield="weight" type="number" step="0.5" min="0" max="250" value="'+esc(v.weight)+'" placeholder="—"></td>';if(t.load==='band')extra='<td><select class="band-choice" data-set="'+eid+'_'+i+'" data-sfield="band"><option value="" '+(!v.band?'selected':'')+'>—</option>'+['خیلی سبک','سبک','متوسط','سنگین'].map(z=>'<option '+(v.band===z?'selected':'')+' value="'+z+'">'+z+'</option>').join('')+'</select></td>';return '<tr><td>'+(i+1)+'</td><td><input aria-label="'+metricLabel+' ست '+(i+1)+'" data-set="'+eid+'_'+i+'" data-sfield="reps" type="number" step="1" min="0" max="300" value="'+esc(v.reps)+'" placeholder="—"></td>'+extra+'<td><button type="button" class="set-check '+(v.done?'done':'')+'" data-toggle-set="'+eid+'_'+i+'" '+(locked?'disabled title="حرکت نیازمند بررسی یا ممنوع است"':'')+' aria-label="'+(v.done?'لغو':'انجام')+' ست '+(i+1)+'" aria-pressed="'+(v.done?'true':'false')+'">'+(v.done?'✓':'○')+'</button></td></tr>'}
function replacementSelect(phase,type,idx,current){const key=phase+'_'+type+'_'+idx;const ov=D.overrides[key]||'__original__';let options='<option value="__original__" '+(ov==='__original__'?'selected':'')+'>حرکت اصلی: '+esc(E[current]?.fa||current)+'</option>';
options+='<option value="__skip__" '+(ov==='__skip__'?'selected':'')+'>حذف این حرکت از برنامه</option>';
options+=Object.entries(E).filter(([id,e])=>id!==current&&e.available!=='no'&&getPolicy(id)!=='blocked').sort((a,b)=>a[1].fa.localeCompare(b[1].fa,'fa')).map(([id,e])=>'<option value="'+esc(id)+'" '+(ov===id?'selected':'')+'>'+esc(e.fa)+' · '+POLICY_LABEL[getPolicy(id)]+'</option>').join('');return '<select class="replace-select" aria-label="جایگزین حرکت" data-replace="'+key+'">'+options+'</select>'}
function exercisesHTML(plan,d){let idx=0;return plan.items.map(([eid,count,reps,original,slot])=>{idx++;const e=E[eid];if(!e)return '';const status=getPolicy(eid),t=trackFor(eid),done=Array.from({length:count},(_,i)=>d.sets[eid+'_'+i]?.done).filter(Boolean).length;const locked=status!=='allowed'||e.available==='no';const second=t.load==='kg'?'<th>وزنه (kg)</th>':t.load==='band'?'<th>مقاومت کش</th>':'';return '<article class="ex '+(locked?'exercise-locked':'')+'"><div class="ex-top"><div class="ex-main"><div class="ex-num">'+String(idx).padStart(2,'0')+'</div><div class="ex-title"><div class="ex-name">'+esc(e.fa)+'</div><div class="en-name">'+esc(e.en)+'</div><div class="ex-target">'+esc(e.target)+'</div></div></div><div class="ex-tools">'+policyTag(eid)+'<span class="set-progress">'+done+' / '+count+' ست</span></div></div><div class="ex-body"><div class="exercise-description">'+esc(e.notes)+'</div>'+(locked?'<div class="policy-hint">'+(status==='blocked'?'حرکت در لیست ممنوع‌های شماست؛ حذف یا جایگزین کنید.':e.available==='no'?'تجهیزات لازم در عکس‌های شما مشخص نیست.':'این حرکت نیازمند بررسی است و هنوز امکان تیک زدن آن فعال نشده.')+'</div>':'')+(D.policyNotes[eid]?'<div class="personal-caution"><strong>یادداشت شخصی:</strong> '+esc(D.policyNotes[eid])+'</div>':'')+'<div class="ex-pills"><span>'+esc(e.equipment)+'</span><span>استراحت '+e.rest+' ثانیه</span><span>'+count+' ست × '+esc(reps)+'</span><span>'+(t.load==='none'?'بدون وزنه':t.load==='band'?'مقاومت کش':'وزنه قابل‌ثبت')+'</span></div><div class="ex-actions"><button class="btn small" type="button" data-exdetail="'+eid+'">جزئیات اجرا</button>'+(e.video?'<a class="btn small ghost" target="_blank" rel="noopener noreferrer" href="'+esc(e.video)+'">مشاهده ویدئو ↗</a>':'<span class="tiny muted">ویدیوی بررسی‌شده موجود نیست</span>')+'<button class="btn small ghost" type="button" data-change-ex="'+slot+'">جایگزینی حرکت</button></div><table class="set-table"><thead><tr><th>ست</th><th>'+(t.metric==='seconds'?'زمان (ثانیه)':'تکرار')+'</th>'+second+'<th>ثبت</th></tr></thead><tbody>'+Array.from({length:count},(_,i)=>setHtml(eid,i,d,locked)).join('')+'</tbody></table></div></article>'}).join('')}
function workoutPage(){const plan=getPlan(selectedDate,selectedType),d=makeDraft(selectedDate,selectedType),sets=completedSets(d,plan),saved=D.logs[keyFor(selectedDate,selectedType)],p=sets.total?Math.round(100*sets.done/sets.total):0;return head('وقتِ تمرین','یک جلسه در هر نوبت؛ بدون عجله و با ثبت دقیق علائم.','هفته '+plan.week+' / ۱۲')+`<div class="hero-panel"><div><span class="hero-label">برنامه امروز · فاز ${plan.phase+1}</span><h2>با تمرکز تمرین کن.<br><em>با آگاهی پیش برو.</em></h2><p>۲ جلسه مقاومتی در هفته · هر نوبت ۴۵ دقیقه</p></div><div class="hero-number">${String(plan.week).padStart(2,'0')}<small>WEEK</small></div></div>`+generalAlert()+statsHtml()+`<div class="card section"><div class="section-head"><h2>جلسه‌ای که می‌خواهید ثبت کنید</h2><small>برای هر روز A یا B را انتخاب کنید</small></div><div class="toolbar"><div class="field"><label>تاریخ</label><input id="workDate" type="date" value="${esc(selectedDate)}"></div><div><div class="eyebrow" style="margin-bottom:5px">نوع فعالیت</div><div class="toggle-row"><button class="tabbtn ${selectedType==='A'?'active':''}" data-type="A">جلسه A</button><button class="tabbtn ${selectedType==='B'?'active':''}" data-type="B">جلسه B</button><button class="tabbtn ${selectedType==='C'?'active':''}" data-type="C">هوازی</button><button class="tabbtn ${selectedType==='D'?'active':''}" data-type="D">فقط ثبت علائم</button></div></div></div><div class="timeline"><span class="pill blue">فاز ${plan.phase+1}: ${P[plan.phase].label}</span><span class="pill">${selectedType==='C'?'۱۰–۳۰ دقیقه قابل تنظیم':selectedType==='D'?'۲ دقیقه ثبت روزانه':'۴۵ دقیقه'}</span><span class="pill">تکنیک آرام و بدون حبس نفس</span></div><div class="notice">${P[plan.phase].desc}. شروع تمرین با وزنه به بررسی عصبی حضوری مشروط است. ممنوعیت پزشک درباره حرکات وزنه‌دار بالای سر پابرجاست.</div></div>`+symptoms(d)+(selectedType==='D'?`<div class="card section"><div class="section-head"><h2>۲. ثبت روز بدون تمرین</h2></div><div class="notice">امروز باشگاه نرفتید؟ ا ad"><h2>۳. پایان جلسه و ثبت نهایی</h2></div><div class="field"><label>یادداشت آزاد (مثلاً کدام حرکت گزگز ایجاد کرد؟)</label><textarea data-draft="note" placeholder="امروز وضعیت گردن و دست‌ها چطور بود؟">${esc(d.note)}</textarea></div><div class="formfooter"><div class="muted tiny">${saved?'این جلسه قبلاً ثبت شده؛ ذخیره مجدد آن را به‌روزرسانی می‌کند.':'تا زمان ذخیره نهایی، تغییرات در پیش‌نویس محلی می‌مانند.'}</div><div class="actionrow"><button type="button" class="btn" data-reset-draft>پاک‌کردن پیش‌نویس</button><button type="button" class="btn primary" data-save> ${isPaused(d)?'ثبت جلسه متوقف‌شده':'ذخیره جلسه'} ✓</button></div></div></div>`}
function planPage(){const phase=phaseOf(programWeek),p=P[phase];return head('برنامه تمرینی','برنامه ۱۲ هفته‌ای؛ هر حرکت را برای هر فاز تغییر بده یا حذف کن.',''+programWeek+' / ۱۲')+generalAlert()+`<div class="card section"><div class="section-head"><h2>انتخاب هفته</h2><small>فازهای برنامه</small></div><div class="progress-weeks">${Array.from({length:12},(_,i)=>{const n=i+1;const complete=Object.values(D.logs).filter(l=>l.week===n&&(l.type==='A'||l.type==='B')).length;return'<button class="week-tile '+(n===programWeek?'current':'')+'" data-week="'+n+'"><strong>'+n+'</strong><small>فاز '+(Math.floor(i/4)+1)+'</small><span class="dots"><span class="dot '+(complete>0?'good':'')+'"></span><span class="dot '+(complete>1?'good':'')+'"></span></span></button>'}).join('')}</div></div><div class="phase-intro"><div><span class="section-kicker">مرحله ${phase+1} از ۳</span><h2>${p.label}</h2><p>${p.desc}</p></div><span class="phase-decoration">0${phase+1}</span></div><div class="notice">جایگزینی یا حذف حرکت در این بخش، در تمام هفته‌های همین فاز اعمال می‌شود و ثبت‌های قبلی را پاک نمی‌کند. وضعیت «مجاز» به معنی تأیید پزشکی نیست.</div>${['A','B'].map(type=>'<section class="card section"><div class="section-head"><div><span class="section-kicker">تمرین مقاومتی</span><h2>جلسه '+type+'</h2></div><button class="btn primary small" data-planstart="'+type+'">رفتن به جلسه ←</button></div><div class="routine-list">'+p[type].map(([original,sets,reps],idx)=>{const override=D.overrides[phase+'_'+type+'_'+idx],id=override==='__skip__'?null:(override&&E[override]?override:original);return '<div class="routine-item"><div class="routine-id">'+String(idx+1).padStart(2,'0')+'</div><div class="routine-detail"><strong>'+esc(id?E[id].fa:'حذف‌شده از جلسه')+'</strong><div class="routine-meta">'+sets+' ست × '+esc(reps)+(id?' · '+policyTag(id):'')+'</div><label class="tiny muted" for="replace_'+type+'_'+idx+'">حرکت جایگزین یا حذف</label>'+replacementSelect(phase,type,idx,original)+'</div></div>'}).join('')+'</div></section>').join('')}<div class="notice">حرکت‌های دارای وضعیت «ممنوع» یا «نیازمند بررسی» تا تغییر وضعیت، برای علامت‌زدن ست‌ها غیرفعال هستند. برای تعریف حرکت جدید، به بخش «حرکات» برو.</div>`}
function histPage(){const logs=Object.values(D.logs).sort((a,b)=>b.date.localeCompare(a.date)||b.updated-b.updated);const days=Array.from({length:28},(_,i)=>plusDays(isoToday(),i-27));return head('تاریخچه تمرین‌ها','همه جلسات و تغییر علائم در یک جا.','ثبت‌شده: '+logs.length)+`<div class="card section"><div class="section-head"><h2>۲۸ روز اخیر</h2><small>روی روز کلیک کنید</small></div><div class="calendar">${days.map(d=>{const arr=logs.filter(x=>x.date===d);return'<button data-calendar="'+d+'" class="calday '+(selectedDate===d?'active':'')+'"><span class="calnum">'+Number(d.slice(-2))+'</span><span class="calmark">'+(arr.length?'● '+arr.map(l=>l.type).join('،'):'—')+'</span></button>'}).join('')}</div></div><div class="card section"><div class="section-head"><h2>جلسه‌های ثبت‌شده</h2><button class="btn small" data-nav="progress">نمایش نمودار</button></div>${logs.length?logs.map(l=>{let stop=l.stop,pc=l.done+'/'+l.total;return'<div class="history-item"><div class="history-icon">'+(l.type==='D'?'✎':l.type==='C'?'♧':'↗')+'</div><div class="history-text"><div class="history-title">'+(l.type==='D'?'ثبت روزانه علائم':l.type==='C'?'هوازی':'جلسه '+l.type)+' • '+esc(l.date)+'</div><div class="history-meta">هفته '+l.week+' • '+(l.type==='D'?'بدون تمرین':l.type==='C'?l.cardioMins+' دقیقه':pc+' ست')+' • درد قبل '+l.prePain+' / بعد '+l.postPain+'</div></div><div class="history-right"><span class="chip '+(stop?'bad':'good')+'">'+(stop?'متوقف':'ثبت‌شده')+'</span><button class="btn small" data-open-log="'+esc(l.date)+'" data-log-type="'+l.type+'">ویرایش</button></div></div>'}).join(''):'<div class="empty"><span class="emoji">◷</span>هنوز جلسه‌ای ثبت نشده است.<br>بعد از یک تمرین، اینجا تاریخچه را می‌بینید.</div>'}</div>`}
function polyChart(logs,mode){if(!logs.length)return'<div class="empty">پس از ثبت حداقل یک جلسه، نمودار ظاهر می‌شود.</div>';const arr=logs.slice(-16),w=680,h=235,pad=35,x=i=>pad+i*(w-2*pad)/Math.max(1,arr.length-1), ymax=mode==='pain'?10:3,y=n=>h-pad-(h-2*pad)*(+n/ymax);const lines=mode==='pain'?[{k:'prePain',color:'#8eb1ee'},{k:'postPain',color:'#2b61da'}]:[{k:'postRight',color:'#2b61da'},{k:'postLeft',color:'#008c86'}];return'<svg class="chart" role="img" aria-label="نمودار علائم در جلسات اخیر" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+Array.from({length:5},(_,i)=>{const v=ymax*i/4;return'<line x1="'+pad+'" y1="'+y(v)+'" x2="'+(w-pad)+'" y2="'+y(v)+'" stroke="#e7ebf3" stroke-dasharray="4 4"/><text x="16" y="'+(y(v)+4)+'" font-size="10" fill="#8491a5">'+v.toFixed(v%1?1:0)+'</text>'}).join('')+lines.map(l=>{const points=arr.map((d,i)=>x(i)+','+y(d[l.k])).join(' ');return'<polyline fill="none" stroke="'+l.color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+points+'"/>'+arr.map((d,i)=>'<circle cx="'+x(i)+'" cy="'+y(d[l.k])+'" r="4.5" fill="'+l.color+'"><title>'+d.date+' : '+d[l.k]+'</title></circle>').join('')}).join('')+arr.filter((_,i)=>i===0||i===arr.length-1||i%Math.max(1,Math.ceil(arr.length/6))===0).map(d=>{let i=arr.indexOf(d);return'<text x="'+x(i)+'" y="'+(h-11)+'" text-anchor="middle" font-size="10" fill="#78859b">'+d.date.slice(5)+'</text>'}).join('')+'</svg>'}
const MEASURES=[['weight','وزن (kg)'],['waist','دور کمر'],['chest','دور سینه'],['hip','دور باسن'],['arm','دور بازو'],['thigh','دور ران'],['calf','دور ساق'],['wrist','دور مچ دست'],['ankle','دور مچ پا']];
function measurementSection(){const records=[...(D.measurementLogs||[])].sort((a,b)=>a.date.localeCompare(b.date));const first=records[0],last=records.at(-1);let rows=MEASURES.map(([id,label])=>{let a=Number(first?.[id]),b=Number(last?.[id]),ok=first?.[id]!==''&&last?.[id]!==''&&first?.[id]!=null&&last?.[id]!=null,delta=ok?(b-a).toFixed(1):'—';return '<div class="measure-row"><span>'+label+'</span><strong>'+(ok?b.toFixed(1):'—')+'</strong><small class="'+(ok&&b<a?'small-decrease':'')+'">'+(ok&&b-a>0?'+':'')+delta+'</small></div>'}).join('');return '<section class="card section"><div class="section-head"><h2>سایزها و ترکیب بدنی</h2><small>هر ۴ هفته، با روش یکسان</small></div><p class="muted tiny">تغییر دور هر قسمت را جداگانه ثبت کن. کاهش چربی موضعی قابل تضمین نیست؛ وزن و سایز در کنار علائم گردن بررسی می‌شوند.</p><div class="measure-table">'+(records.length?'<div class="tiny muted">از اولین تا آخرین ثبت · '+esc(first.date)+' تا '+esc(last.date)+'</div>'+rows:'<div class="notice">هنوز سایزی ثبت نشده. اطلاعات پایه را فقط روی گوشی خودت وارد کن؛ این داده‌ها به گیت‌هاب ارسال نمی‌شوند.</div>')+'</div><div class="section-kicker" style="margin-top:18px">ثبت سایز جدید</div><div class="formgrid three"><div class="field"><label>تاریخ</label><input type="date" id="measureDate" value="'+isoToday()+'"></div>'+MEASURES.map(([id,label])=>'<div class="field"><label>'+label+'</label><input id="measure_'+id+'" type="number" min="0" max="300" step="0.1" placeholder="'+(id==='weight'?'kg':'cm')+'"></div>').join('')+'</div><button class="btn primary" type="button" data-save-measure>ثبت اندازه‌ها</button><div class="tiny muted" style="margin-top:9px">اگر یک قسمت را اندازه نگرفته‌ای، آن را خالی بگذار. ثبت با تاریخ تکراری جایگزین می‌شود.</div></section>'}
function progressPage(){const logs=Object.values(D.logs).sort((a,b)=>a.date.localeCompare(b.date)),total=logs.filter(l=>l.type==='A'||l.type==='B').length,days=Object.keys(D.logs).length,pre=logs.filter(l=>l.type==='A'||l.type==='B');const weeks=Array.from({length:12},(_,i)=>pre.filter(l=>l.week===i+1).length);return head('پیشرفت و علائم','روند تمرین، درد و گزگز را کنار هم ببینید.','۱۲ هفته')+statsHtml()+`<div class="card section"><div class="section-head"><h2>روند علائم</h2><div class="toggle-row"><button class="tabbtn ${chartMode==='pain'?'active':''}" data-chart="pain">درد</button><button class="tabbtn ${chartMode==='numbness'?'active':''}" data-chart="numbness">گزگز دو دست</button></div></div>${polyChart(logs,chartMode)}<div class="legend"><span>${chartMode==='pain'?'درد بعد':'دست راست بعد'}</span><span>${chartMode==='pain'?'درد قبل':'دست چپ بعد'}</span></div><p class="muted tiny">نمودار توصیفی است و به‌تنهایی نشان‌دهنده بهبودی یا ایمنی برنامه نیست.</p></div><div class="card section"><div class="section-head"><h2>تعداد جلسات مقاومتی در هفته</h2><small>هدف: ۲ جلسه پس از تأیید تمرین</small></div>${weeks.map((n,i)=>'<div style="display:grid;grid-template-columns:70px 1fr 35px;align-items:center;gap:9px;margin:9px 0"><small class="muted">هفته '+(i+1)+'</small><div class="bar"><div style="width:'+Math.min(100,n/2*100)+'%"></div></div><small>'+n+' / ۲</small></div>').join('')}</div><div class="card section"><h2 style="font-size:16px">برای بررسی پیشرفت واقعی</h2><p class="muted">در کنار وزنه و تعداد جلسات، تعداد بیدارشدن‌های شبانه، مدت کار بدون درد با لپ‌تاپ و شدت علائم عصبی را پیگیری کنید. افزایش قدرت به‌تنهایی دلیل کاهش تماس دیسک با نخاع نیست.</p></div>`+measurementSection()}

d" '+(getPolicy(id)==='blocked'?'selected':'')+'>ممنوع در برنامه من</option></select></div><div class="policy-note"><label>یادداشت اختصاصی (اختیاری)</label><input data-policy-note="'+esc(id)+'" maxlength="240" placeholder="مثلاً: درد کتف / محدودیت پزشک..." value="'+esc(D.policyNotes[id]||'')+'"></div><div class="lib-links"><button class="btn small ghost" data-exdetail="'+esc(id)+'">راهنمای اجرا</button>'+(e.video?'<a class="btn small ghost" target="_blank" rel="noopener noreferrer" href="'+esc(e.video)+'">ویدئو ↗</a>':'')+(D.customExercises[id]?'<button class="btn small ghost" data-edit-custom="'+esc(id)+'">ویرایش</button>':'')+'</div></div></article>').join('')}</div><div class="notice" style="margin-top:16px">برای جایگزین‌کردن یک حرکت در جلسه A یا B، به بخش «برنامه» برو و از فهرست مقابل همان حرکت، جایگزین را انتخاب کن. تغییرها در مرورگر فعلی ذخیره می‌شوند.</div>`}
function customExerciseModal(id){const e=id?D.customExercises[id]:null;modal(e?'ویرایش حرکت':'حرکت جدید',`<p class="muted">حرکت را به کتابخانه اضافه کن، سپس از بخش برنامه به‌عنوان جایگزین انتخابش کن.</p><div class="custom-fields"><label>نام فارسی<input id="customFa" maxlength="70" value="${esc(e?.fa||'')}" placeholder="مثلاً: کشش ملایم کتف بدون وزنه"></label><label>نام انگلیسی<input id="customEn" maxlength="70" value="${esc(e?.en||'')}" placeholder="Exercise name"></label><label>عضلات هدف<input id="customTarget" maxlength="110" value="${esc(e?.target||'')}" placeholder="مثلاً پشت شانه"></label><label>تجهیزات<input id="customTools" maxlength="110" value="${esc(e?.equipment||'')}" placeholder="کش سبک، صندلی، دستگاه..."></label><label>توضیحات اجرا<textarea id="customNotes" maxlength="420" rows="3">${esc(e?.notes||'')}</textarea></label><label>موارد احتیاط<textarea id="customCaution" maxlength="420" rows="2">${esc(e?.caution||'در صورت افزایش درد یا علائم عصبی، توقف کنید.')}</textarea></label><label>نوع ثبت فعالیت<select id="customTrack"><option value="body" ${!e?.track||e.track.load==='none'&&e.track.metric!=='seconds'?'selected':''}>تکرار، بدون وزنه</option><option value="hold" ${e?.track?.metric==='seconds'?'selected':''}>ثانیه، بدون وزنه</option><option value="machine" ${e?.track?.load==='kg'?'selected':''}>تکرار + کیلوگرم</option><option value="band" ${e?.track?.load==='band'?'selected':''}>تکرار + مقاومت کش</option></select></label><label>آدرس ویدئو HTTPS (اختیاری)<input id="customVideo" type="url" value="${esc(e?.video||'')}" placeholder="https://..."></label></div>`, '<button class="btn" data-modal-close>لغو</button><button class="btn primary" data-save-custom="'+esc(id||'new')+'">ذخیره حرکت</button>')}
function settingsPage(){return head('تنظیمات و اطلاعات','شروع برنامه، یادداشت پزشک و پشتیبان‌گیری از همه داده‌ها.','ذخیره محلی')+`<div class="card section"><div class="section-head"><h2>اطلاعات برنامه</h2></div><div class="formgrid three"><div class="field"><label>نام نمایشی (اختیاری)</label><input data-setting="person" value="${esc(D.person)}" placeholder="نام"></div><div class="field"><label>تاریخ شروع ۱۲ هفته</label><input type="date" data-setting="startDate" value="${esc(D.startDate)}"></div><div class="field"><label>وزن فعلی، صرفاً جهت یادداشت (kg)</label><input type="number" id="weightEntry" min="20" max="300" step="0.1" placeholder="۶۳"></div></div><button class="btn small" data-save-weight>ثبت وزن در تاریخ امروز</button><p class="tiny muted">تغییر تاریخ شروع، شماره هفته برای جلسات جدید را تغییر می‌دهد؛ اطلاعات جلسات قبلی حذف نمی‌شود.</p><hr class="sep"><h2 style="font-size:16px">تأیید شرایط شروع تمرین با وزنه</h2><label class="checkline"><input type="checkbox" data-setting="doctorCheck" ${D.doctorCheck?'checked':''}><span>پس از MRI و بررسی علائم گزگز دوطرفه، ارزیابی حضوری مرتبط انجام شده و پزشک/فیزیوتراپیست ادامه تمرین مقاومتی سبک را مجاز دانسته است.</span></label><div class="field"><label>یادداشت پزشک / محدودیت‌ها</label><textarea data-setting="doctorNote" placeholder="مثلاً: حرکات با وزنه بالای سر ممنوع. تاریخ و نتیجه بررسی عصبی...">${esc(D.doctorNote)}</textarea></div><div class="notice" style="margin-top:12px">معاینه و نوار عصب‌وعضله قبلی را می‌توانی در یادداشت پزشک ثبت کنی؛ نتیجه طبیعیِ قدیمی به‌تنهایی تأیید علائم فعلی نیست. علامت‌زدن این گزینه تأیید پزشکی ایجاد نمی‌کند.</div><div class="actionrow"><button class="btn" type="button" data-nav="library">مدیریت حرکات مجاز و ممنوع ←</button><button class="btn" type="button" data-nav="program">ویرایش برنامه تمرین ←</button></div></div><div class="card section"><div class="section-head"><h2>حریم خصوصی و نسخه پشتیبان</h2></div><p class="muted">وزنه‌ها، تاریخچه و علائم روی حافظه همین مرورگر ذخیره می‌شوند؛ هیچ حس document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-policy]')){D.policy[t.dataset.policy]=t.value;if(t.value!=='allowed'){for(const draft of Object.values(D.drafts))for(const [key,set] of Object.entries(draft.sets||{}))if(key.startsWith(t.dataset.policy+'_'))set.done=false}persist();render();toast('وضعیت حرکت ذخیره شد.');return}if(t.matches('select[data-set]')){const d=getDraft(),id=t.dataset.set,f=t.dataset.sfield;if(!d.sets[id])d.sets[id]={done:false,reps:'',weight:'',band:''};d.sets[id][f]=t.value;persist();return}if(t.matches('[data-replace]')){const key=t.dataset.replace;if(t.value==='__original__')delete D.overrides[key];else D.overrides[key]=t.value;persist();render();toast('برنامه این فاز به‌روزرسانی شد.');return}if(t.matches('[data-draft]'))updateField(t);if(t.matches('[data-setting]')){let k=t.dataset.setting;D[k]=t.type==='checkbox'?t.checked:t.value;persist();if(k==='startDate'){programWeek=weekOf(selectedDate);render()}else if(k==='doctorCheck')render()}if(t.id==='workDate'){selectedDate=t.value||isoToday();render()}if(t.id==='importFile'&&t.files[0]){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.version!==1||!obj.logs||!obj.drafts||typeof obj.logs!=='object')throw Error('ساختار نامعتبر');modal('بازیابی اطلاعات','<p>فایل معتبر به نظر می‌رسد. بازیابی تمام داده‌های فعلی را با اطلاعات فایل جایگزین خواهد کرد.</p>','<button class="btn" data-modal-close>انصراف</button><button class="btn primary" data-confirm-import>تأیید بازیابی</button>');window.__importData=obj}catch(err){toast('این فایل پشتیبان معتبر نیست.')}};reader.readAsText(t.files[0])}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-policy-note]')){D.policyNotes[t.dataset.policyNote]=t.value;persist();return}if(t.matches('[data-draft]'))updateField(t);if(t.matches('[data-setting]')&&t.type!=='date'&&t.type!=='checkbox'){D[t.dataset.setting]=t.value;persist()}if(t.matches('[data-set]')){const d=getDraft(),id=t.dataset.set,f=t.dataset.sfield;if(!d.sets[id])d.sets[id]={done:false,reps:'',weight:''};d.sets[id][f]=t.value;persist()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-ack-migration')){D.migrationNotice=false;persist();render();return}if(b.dataset.nav){navTo(b.dataset.nav);return}if(b.dataset.filter){libraryFilter=b.dataset.filter;render();return}if(b.hasAttribute('data-new-ex')){customExerciseModal();return}if(b.hasAttribute('data-edit-custom')){customExerciseModal(b.dataset.editCustom);return}if(b.hasAttribute('data-change-ex')){programWeek=weekOf(selectedDate);navTo('program');toast('حرکت موردنظر را در فهرست جایگزین همین جلسه انتخاب کن.');return}if(b.hasAttribute('data-save-custom')){const id=b.dataset.saveCustom==='new'?'custom_'+Date.now():b.dataset.saveCustom;const v=k=>document.getElementById(k)?.value.trim()||'';const fa=v('customFa'),en=v('customEn'),video=v('customVideo');if(!fa||!en){toast('نام فارسی و انگلیسی حرکت لازم است.');return}if(video){try{const u=new URL(video);if(u.protocol!=='https:')throw Error('url')}catch(e){toast('آدرس ویدئو باید با https:// شروع شود.');return}}const exercise={fa,en,target:v('customTarget')||'عضلات هدف تعیین نشده',equipment:v('customTools')||'مشخص نشده',notes:v('customNotes')||'تکنیک باید توسط مربی بررسی شود.',caution:v('customCaution')||'در صورت افزایش علائم توقف کنید.',video,alternative:'یک حرکت سبک‌تر مناسب با نظر درمانگر',rest:60,available:'yes',track:METRICS[document.getElementById('customTrack')?.value]||METRICS.body};D.customExercises[id]=exercise;E[id]=exercise;if(!D.policy[id])D.policy[id]='review';persist();closeModal();libraryFilter='all';navTo('library');toast('حرکت جدید به کتابخانه اضافه شد.');return}if(b.dataset.type){selectedType=b.dataset.type;render();return}if(b.dataset.week){programWeek=+b.dataset.week;render();return}if(b.dataset.planstart){selectedDate=plusDays(D.startDate,(programWeek-1)*7+(b.dataset.planstart==='B'?3:0));selectedType=b.dataset.planstart;navTo('today');return}if(b.dataset.calendar){selectedDate=b.dataset.calendar;selectedType='A';navTo('today');return}if(b.dataset.openLog){selectedDate=b.dataset.openLog;selectedType=b.dataset.logType;const key=keyFor(selectedDate,selectedType);if(D.logs[key])D.drafts[key]=JSON.parse(JSON.stringify(D.logs[key]));persist();navTo('today');return}if(b.dataset.toggleSet){const eid=b.dataset.toggleSet.split('_').slice(0,-1).join('_');if(getPolicy(eid)!=='allowed'){toast('ابتدا وضعیت این حرکت را در کتابخانه حرکات تعیین کن.');return}const d=getDraft();if(isPaused(d)){toast('ابتدا علت تشدید علائم را بررسی کنید؛ ادامه ست‌ها متوقف است.');return}const id=b.dataset.toggleSet;if(!d.sets[id])d.sets[id]={done:false,reps:'',weight:''};d.sets[id].done=!d.sets[id].done;persist();b.classList.toggle('done',d.sets[id].done);b.textContent=d.sets[id].done?'✓':'○';b.setAttribute('aria-pressed',String(d.sets[id].done));const container=b.closest('.ex'),chip=container?.querySelector('.ex-tools .chip'),count=container?.querySelectorAll('.set-check.done').length,total=container?.querySelectorAll('.set-check').length;if(chip)chip.textContent=count+'/'+total+' ست';if(chip)chip.classList.toggle('good',count===total);updateSets();return}if(b.dataset.exdetail){const ex=E[b.dataset.exdetail];modal(ex.fa,'<div class="eyebrow">'+ex.en+' • '+ex.target+'</div><p>'+ex.notes+'</p><div class="notice">'+ex.caution+'</div><p><strong>جایگزین:</strong> '+ex.alternative+'</p><p class="tiny muted">استراحت '+ex.rest+' ثانیه. سرعت کنترل‌شده حدود ۲ ثانیه رفت و ۲–۳ ثانیه بازگشت. مقاومت تنها برای حرکات وزنه‌دار ثبت می‌شود؛ برای حرکت‌های بدون وزنه فقط تکرار یا ثانیه ثبت کن. از حبس نفس و تلاش تا ناتوانی بپرهیز.</p>',(ex.video?'<a class="btn primary" target="_blank" rel="noopener noreferrer" href="'+ex.video+'">▶ تماشای ویدئو</a>':'')+'<button class="btn" data-modal-close>بستن</button>');return}if(b.hasAttribute('data-save')){saveSession();return}if(b.hasAttribute('data-reset-draft')){modal('پاک‌کردن پیش‌نویس؟','<p>تغییرات ذخیره‌نشده این جلسه پاک می‌شود. جلسه‌های ثبت‌شده در تاریخچه حذف نمی‌شوند.</p>','<button class="btn" data-modal-close>انصراف</button><button class="btn danger" data-confirm-reset>حذف پیش‌نویس</button>');return}if(b.hasAttribute('data-confirm-reset')){delete D.drafts[keyFor(selectedDate,selectedType)];persist();closeModal();render();return}if(b.hasAttribute('data-modal-close')){closeModal();return}if(b.hasAttribute('data-confirm-import')){D={...defaultData(),...window.__importData};D.policy=D.policy||{};D.policyNotes=D.policyNotes||{};D.overrides=D.overrides||{};D.customExercises=D.customExercises||{};Object.assign(E,D.customExercises);if(window.__importData.programVersion!==3){D.oldPlanOverridesV2={...(D.overrides||{})};D.overrides={};D.programVersion=3;D.migrationNotice=true;}D.measurementLogs=D.measurementLogs||[];persist();closeModal();render();toast('اطلاعات بازیابی شد.');return}if(b.hasAttribute('data-export')){downloadFile(JSON.stringify(D,null,2),'hamrah-tamrin-backup-'+isoToday()+'.json','application/json;charset=utf-8');return}if(b.hasAttribute('data-csv')){const cols=['date','type','week','done','total','prePain','postPain','preRight','postRight','preLeft','postLeft','sleepWakes','cardioMode','cardioMins','rpe','stop','note'],rows=[cols.join(',')];Object.values(D.logs).sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>rows.push(cols.map(k=>'"'+String(o[k]??'').replace(/"/g,'""')+'"').join(',')));downloadFile('\ufeff'+rows.join('\n'),'hamrah-tamrin-history-'+isoToday()+'.csv','text/csv;charset=utf-8');return}if(b.hasAttribute('data-import')){document.getElementById('importFile')?.click();return}if(b.hasAttribute('data-clear')){modal('حذف تمام اطلاعات؟','<p style="color:#a32a30">تمام جلسات، پیش‌نویس‌ها و یادداشت‌های محلی برای همیشه حذف می‌شوند. ابتدا پشتیبان تهیه کنید.</p>','<button class="btn" data-modal-close>انصراف</button><button class="btn danger" data-confirm-clear>حذف دائمی</button>');return}if(b.hasAttribute('data-confirm-clear')){D=defaultData();localStorage.removeItem(KEY);closeModal();selectedDate=isoToday();render();toast('داده‌های محلی حذف شدند.');return}if(b.hasAttribute('data-chart')){chartMode=b.dataset.chart;render();return}if(b.hasAttribute('data-save-measure')){const date=document.getElementById('measureDate')?.value||isoToday();const o={date};let any=false;for(const [id] of MEASURES){const v=document.getElementById('measure_'+id)?.value;o[id]=v===''?'':Number(v);if(v!==''&&Number.isFinite(Number(v))&&Number(v)>0)any=true;}if(!any){toast('حداقل یک اندازه وارد کن.');return}D.measurementLogs=(D.measurementLogs||[]).filter(x=>x.date!==date);D.measurementLogs.push(o);persist();render();toast('سایزها ثبت شدند ✓');return}if(b.hasAttribute('data-save-weight')){const el=document.getElementById('weightEntry'),v=Number(el?.value);if(!Number.isFinite(v)||v<20||v>300){toast('وزن معتبر را وارد کنید.');return}D.weightHistory.push({date:isoToday(),weight:v});persist();toast('وزن ثبت شد.');if(el)el.value='';return}});
