 plank:{fa:'پلانک اصلاح‌شده روی زانو',en:'Modified plank',target:'شکم و پایداری تنه',video:VIDEOS.plank,notes:'ساعد و زانو روی زمین؛ بدن در راستای راحت و نگاه پایین؛ تنفس طبیعی.',caution:'با خستگی گردن یا علائم دست فوراً متوقف کنید.',alternative:'Dead bug ساده',equipment:'مت',rest:60}

const P=[
 {label:'آشنایی و کنترل حرکت',desc:'فرم صحیح، تحمل علائم، حرکت آهسته؛ RPE حدود ۳–۴/۱۰',A:[['rowSupport',2,'۱۰'],['leg',2,'۱۰'],['rot',2,'۱۰ هر طرف'],['dead',2,'۶ هر طرف'],['glute',2,'۱۰']],B:[['rowCable',2,'۱۰'],['chest',2,'۱۰'],['pallof',1,'۸ هر طرف'],['bird',2,'۶ هر طرف'],['glute',2,'۱۰']]},
 {label:'تقویت تدریجی',desc:'در صورت تحمل فاز قبل؛ RPE حدود ۴–۶/۱۰',A:[['rowSupport',3,'۱۰–۱۲'],['leg',2,'۱۲'],['rot',2,'۱۲'],['dead',2,'۸ هر طرف'],['pallof',2,'۸ هر طرف']],B:[['rowCable',2,'۱۲'],['chest',2,'۱۰–۱۲'],['face',2,'۱۰'],['glute',2,'۱۲'],['bird',2,'۸ هر طرف']]},
 {label:'قدرت و تحمل عملکردی',desc:'بدون علائم عصبی جدید؛ RPE حدود ۵–۷/۱۰ و حداقل ۳ تکرار در ذخیره',A:[['rowSupport',3,'۸–۱۲'],['leg',3,'۱۰'],['rot',2,'۱۲–۱۵'],['pallof',2,'۱۰ هر طرف'],['dead',2,'۸ هر طرف']],B:[['rowCable',2,'۱۰–۱۲'],['chest',2,'۱۰'],['face',2,'۱۲'],['glute',2,'۱۲'],['bird',2,'۸ هر طرف']]}
];
const CARDIO=[['walk',1,'۱۰–۱۵ دقیقه']];
const isoToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function plusDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultData=()=>({version:1,startDate:isoToday(),person:'',doctorCheck:false,doctorNote:'',logs:{},drafts:{},weightHistory:[],settingsDate:isoToday()});
let D=defaultData();try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.version===1&&old.logs&&old.drafts)D={...D,...old}}catch(e){}
let view='today',selectedDate=isoToday(),selectedType='A',programWeek=1,showDetails={},chartMode='pain';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('امکان ذخیره در این مرورگر وجود ندارد؛ فایل پشتیبان تهیه کنید.')}}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML='<div class="quick-notice">'+esc(s)+'</div>';setTimeout(()=>root.innerHTML='',3200)}
function weekOf(date){return Math.min(12,Math.max(1,Math.floor((new Date(date+'T12:00:00')-new Date(D.startDate+'T12:00:00'))/86400000/7)+1))}
function phaseOf(w){return Math.floor((w-1)/4)}
function keyFor(date,type){return date+'_'+type}
function getPlan(date,type){const week=weekOf(date),phase=phaseOf(week);return{week,phase,items:type==='C'?CARDIO:type==='D'?[]:P[phase][type]}}
function makeDraft(date,type){const key=keyFor(date,type),plan=getPlan(date,type);if(!D.drafts[key]){D.drafts[key]={date,type,week:plan.week,prePain:3,postPain:3,preRight:1,preLeft:1,postRight:1,postLeft:1,sleepWakes:0,stiffness:2,stiffnessAfter:2,energy:3,note:'',neuroNew:false,handTrouble:false,gait:false,bladder:false,tingleWorse:false,sets:{},exerciseSkip:{},cardioMins:10,weight:'',rpe:4,finished:false};persist()}return D.drafts[key]}
function hasDanger(d){return Boolean(d.neuroNew||d.handTrouble||d.gait||d.bladder)}
function hasWorsen(d){return Boolean(d.tingleWorse||Number(d.postRight)>Number(d.preRight)||Number(d.postLeft)>Number(d.preLeft))}
function isPaused(d){return hasDanger(d)||hasWorsen(d)}
function completedSets(d,plan){let total=0,done=0;for(const [eid,count] of plan.items){if(eid==='walk')continue;for(let i=0;i<count;i++){total++;if(d.sets[eid+'_'+i]?.done)done++}}return{total,done}}
function calcStatus(d){if(hasDanger(d))return{status:'danger',label:'علائم هشدار: توقف تمرین و ارزیابی فوری',hint:'ضعف جدید، اختلال مهارت دست، تعادل یا کنترل ادرار/مدفوع را نادیده نگیرید؛ علائم ناگهانی یا شدید نیازمند رسیدگی اورژانسی است.'};if(hasWorsen(d))return{status:'danger',label:'تشدید گزگز/بی‌حسی: توقف جلسه',hint:'تمرین مقاومتی را ادامه ندهید؛ با درمانگر درباره تغییر علائم مشورت کنید.'};if(Number(d.postPain)>=6)return{status:'warning',label:'درد شدید: افزایش بار ممنوع',hint:'از ادامه حرکات تحریک‌کننده خودداری کنید و برای حملات درد شدید یا ماندگار ارزیابی بگیرید.'};return{status:'info',label:'پایش علائم فعال است',hint:'فقدان علامت هشدار در فرم، جایگزین معاینه عصبی و تأیید حضوری نیست.'}}
function navTo(n){view=n;render();window.scrollTo({top:0,behavior:'instant'})}
function head(title,subtitle,badge){return '<div class="page-head"><div><h1>'+title+'</h1><p class="subtitle">'+subtitle+'</p></div>'+(badge?'<span class="head-pill">'+badge+'</span>':'')+'</div>'}
function generalAlert(){return !D.doctorCheck?'<div class="alert warning"><span class="alert-icon">⚠</span><div><strong>قبل از شروع وزنه‌زدن: ارزیابی عصبی حضوری</strong><span>به دلیل گزگز دوطرفه شبانه و تماس دیسک با نخاع، برنامه مقاومتی نیازمند بررسی قدرت، رفلکس و حس است. <button class="btn small" data-nav="settings" type="button" style="margin-right:6px">ثبت نتیجه بررسی</button></span></div></div>':''}
function statsHtml(){const logs=Object.values(D.logs),weights=logs.filter(x=>x.type==='A'||x.type==='B'),days=new Set(logs.map(x=>x.date)).size;const avg=logs.filter(x=>Number.isFinite(+x.postPain)).map(x=>+x.postPain);return '<div class="stats"><div class="card stat accent"><div class="value">'+logs.length+'</div><div class="sub">جلسه ثبت‌شده</div></div><div class="card stat green"><div class="value">'+weights.length+'</div><div class="sub">جلسه مقاومتی</div></div><div class="card stat"><div class="value">'+days+'</div><div class="sub">روز فعال</div></div><div class="card stat"><div class="value">'+(avg.length?(avg.reduce((a,b)=>a+b,0)/avg.length).toFixed(1):'—')+'</div><div class="sub">میانگین درد پس از تمرین</div></div></div>'}
function inputSmall(label,id,val,min,max,extra=''){return'<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="number" min="'+min+'" max="'+max+'" value="'+esc(val)+'" '+extra+'></div>'}
function sel(label,field,value,items){return'<div class="field"><label>'+label+'</label><select data-draft="'+field+'">'+items.map(([n,t])=>'<option value="'+n+'" '+(String(value)===String(n)?'selected':'')+'>'+t+'</option>').join('')+'</select></div>'}
function symptoms(d){const painVals=[[0,'۰—بدون'],[1,'۱—خفیف'],[2,'۲—متوسط'],[3,'۳—شدید']];return `<div class="card section"><div class="section-head"><h2>۱. وضعیت بدن و علائم</h2><small>قبل و بعد هر جلسه ثبت کنید</small></div><div class="formgrid">${inputSmall('درد قبل (۰–۱۰)','prePain',d.prePain,0,10,'data-draft="prePain"')}${inputSmall('درد بعد (۰–۱۰)','postPain',d.postPain,0,10,'data-draft="postPain"')}${inputSmall('بیداری شب قبل از گزگز','sleepWakes',d.sleepWakes,0,20,'data-draft="sleepWakes"')}${inputSmall('شدت جلسه RPE (۰–۱۰)','rpe',d.rpe,0,10,'data-draft="rpe"')}</div><div class="formgrid">${sel('گزگز دست راست قبل','preRight',d.preRight,painVals)}${sel('گزگز دست راست بعد','postRight',d.postRight,painVals)}${sel('گزگز دست چپ قبل','preLeft',d.preLeft,painVals)}${sel('گزگز دست چپ بعد','postLeft',d.postLeft,painVals)}</div><div class="mini-title">غربالگری تغییرات عصبی</div><label class="checkline"><input type="checkbox" data-draft="tingleWorse" ${d.tingleWorse?'checked':''}><span>حین تمرین گزگز یا بی‌حسی جدید/بدتر شده است</span></label><label class="checkline"><input type="checkbox" data-draft="neuroNew" ${d.neuroNew?'checked':''}><span>ضعف واقعی جدید یا پیشرونده در دست یا پا</span></label><label class="checkline"><input type="checkbox" data-draft="handTrouble" ${d.handTrouble?'checked':''}><span>مشکل جدید در دکمه بستن، نوشتن، گرفتن اشیا یا هماهنگی دست</span></label><label class="checkline"><input type="checkbox" data-draft="gait" ${d.gait?'checked':''}><span>اختلال جدید در تعادل یا راه‌رفتن</span></label><label class="checkline"><input type="checkbox" data-draft="bladder" ${d.bladder?'checked':''}><span>اختلال جدید کنترل ادرار/مدفوع یا مشکل غیرمعمول تخلیه</span></label><div id="statusArea">${safetyAlert(d)}</div></div>`}
function safetyAlert(d){const s=calcStatus(d);return'<div class="alert '+s.status+'" style="margin:12px 0 0"><span class="alert-icon">'+(s.status==='danger'?'⛔':s.status==='warning'?'⚠':'ⓘ')+'</span><div><strong>'+s.label+'</strong><span>'+s.hint+'</span></div></div>'}
function setHtml(eid,i,d){const v=d.sets[eid+'_'+i]||{done:false,reps:'',weight:''};return'<tr><td>'+(i+1)+'</td><td><input aria-label="تکرار ست '+(i+1)+'" data-set="'+eid+'_'+i+'" data-sfield="reps" type="number" step="1" min="0" max="200" value="'+esc(v.reps)+'" placeholder="—"></td><td><input aria-label="وزنه ست '+(i+1)+'" data-set="'+eid+'_'+i+'" data-sfield="weight" type="number" step="0.5" min="0" max="500" value="'+esc(v.weight)+'" placeholder="—"></td><td><button type="button" class="set-check '+(v.done?'done':'')+'" data-toggle-set="'+eid+'_'+i+'" aria-label="'+(v.done?'لغو':'انجام')+' ست '+(i+1)+'" aria-pressed="'+(v.done?'true':'false')+'">'+(v.done?'✓':'○')+'</button></td></tr>'}
function exercisesHTML(plan,d){let idx=0;return plan.items.map(([eid,count,reps])=>{idx++;const e=E[eid];if(!e)return'';const done=Array.from({length:count},(_,i)=>d.sets[eid+'_'+i]?.done).filter(Boolean).length;return'<article class="ex"><div class="ex-top"><div style="display:flex;align-items:center;gap:9px;min-width:0"><div class="ex-num">'+idx+'</div><div><div class="ex-name">'+e.fa+'</div><span class="en-name">'+e.en+'</span><div class="ex-target">'+e.target+' • '+count+' ست × '+reps+'</div></div></div><div class="ex-tools"><span class="chip '+(done===count?'good':'')+'">'+done+'/'+count+' ست</span>'+(e.video?'<a class="btn small ghost" target="_blank" rel="noopener noreferrer" href="'+e.video+'">▶ ویدئو</a>':'<span class="pill">ویدئوی تأییدشده ندارد</span>')+'<button class="btn small" type="button" data-exdetail="'+eid+'">راهنما</button></div></div><div class="ex-body"><p class="ex-note">'+e.notes+'</p><div class="ex-safety">⚠ '+e.caution+'</div><div class="timeline"><span class="pill">'+e.equipment+'</span><span class="pill">استراحت '+e.rest+' ثانیه</span><span class="pill">وزنه سبک، RPE فاز</span></div><table class="set-table"><thead><tr><th>ست</th><th>تکرار واقعی</th><th>وزنه kg</th><th>انجام شد</th></tr></thead><tbody>'+Array.from({length:count},(_,i)=>setHtml(eid,i,d)).join('')+'</tbody></table></div></article>'}).join('')}
function workoutPage(){const plan=getPlan(selectedDate,selectedType),d=makeDraft(selectedDate,selectedType),sets=completedSets(d,plan),saved=D.logs[keyFor(selectedDate,selectedType)],p=sets.total?Math.round(100*sets.done/sets.total):0;return head('تمرین و پایش امروز','هر ست را انجام دادید علامت بزنید؛ اطلاعات به‌صورت خودکار پیش‌نویس می‌شود.','هفته '+plan.week+' از ۱۲')+generalAlert()+statsHtml()+`<div class="card section"><div class="section-head"><h2>جلسه‌ای که می‌خواهید ثبت کنید</h2><small>برای هر روز A یا B را انتخاب کنید</small></div><div class="toolbar"><div class="field"><label>تاریخ</label><input id="workDate" type="date" value="${esc(selectedDate)}"></div><div><div class="eyebrow" style="margin-bottom:5px">نوع فعالیت</div><div class="toggle-row"><button class="tabbtn ${selectedType==='A'?'active':''}" data-type="A">جلسه A</button><button class="tabbtn ${selectedType==='B'?'active':''}" data-type="B">جلسه B</button><button class="tabbtn ${selectedType==='C'?'active':''}" data-type="C">هوازی</button><button class="tabbtn ${selectedType==='D'?'active':''}" data-type="D">فقط ثبت علائم</button></div></div></div><div class="timeline"><span class="pill blue">فاز ${plan.phase+1}: ${P[plan.phase].label}</span><span class="pill">${selectedType==='C'?'۱۰–۳۰ دقیقه قابل تنظیم':selectedType==='D'?'۲ دقیقه ثبت روزانه':'۴۵ دقیقه'}</span><span class="pill">تکنیک آرام و بدون حبس نفس</span></div><div class="notice">${P[plan.phase].desc}. شروع تمرین با وزنه به بررسی عصبی حضوری مشروط است. ممنوعیت پزشک درباره حرکات وزنه‌دار بالای سر پابرجاست.</div></div>`+symptoms(d)+(selectedType==='D'?`<div class="card section"><div class="section-head"><h2>۲. ثبت روز بدون تمرین</h2></div><div class="notice">امروز باشگاه نرفتید؟ ایرادی ندارد. درد، گزگز دو دست، تعداد بیداری شب و یادداشت را ثبت کنید. در تاریخچه و نمودار پیشرفت نیز نمایش داده می‌شود.</div></div>`:selectedType==='C'?`<div class="card section"><div class="section-head"><h2>۲. فعالیت هوازی کم‌فشار</h2></div><div class="notice">پیاده‌ function histPage(){const logs=Object.values(D.logs).sort((a,b)=>b.date.localeCompare(a.date)||b.updated-b.updated);const days=Array.from({length:28},(_,i)=>plusDays(isoToday(),i-27));return head('تاریخچه تمرین‌ها','همه جلسات و تغییر علائم در یک جا.','ثبت‌شده: '+logs.length)+`<div class="card section"><div class="section-head"><h2>۲۸ روز اخیر</h2><small>روی روز کلیک کنید</small></div><div class="calendar">${days.map(d=>{const arr=logs.filter(x=>x.date===d);return'<button data-calendar="'+d+'" class="calday '+(selectedDate===d?'active':'')+'"><span class="calnum">'+Number(d.slice(-2))+'</span><span class="calmark">'+(arr.length?'● '+arr.map(l=>l.type).join('،'):'—')+'</span></button>'}).join('')}</div></div><div class="card section"><div class="section-head"><h2>جلسه‌های ثبت‌شده</h2><button class="btn small" data-nav="progress">نمایش نمودار</button></div>${logs.length?logs.map(l=>{let stop=l.stop,pc=l.done+'/'+l.total;return'<div class="history-item"><div class="history-icon">'+(l.type==='D'?'✎':l.type==='C'?'♧':'↗')+'</div><div class="history-text"><div class="history-title">'+(l.type==='D'?'ثبت روزانه علائم':l.type==='C'?'هوازی':'جلسه '+l.type)+' • '+esc(l.date)+'</div><div class="history-meta">هفته '+l.week+' • '+(l.type==='D'?'بدون تمرین':l.type==='C'?l.cardioMins+' دقیقه':pc+' ست')+' • درد قبل '+l.prePain+' / بعد '+l.postPain+'</div></div><div class="history-right"><span class="chip '+(stop?'bad':'good')+'">'+(stop?'متوقف':'ثبت‌شده')+'</span><button class="btn small" data-open-log="'+esc(l.date)+'" data-log-type="'+l.type+'">ویرایش</button></div></div>'}).join(''):'<div class="empty"><span class="emoji">◷</span>هنوز جلسه‌ای ثبت نشده است.<br>بعد از یک تمرین، اینجا تاریخچه را می‌بینید.</div>'}</div>`}
function polyChart(logs,mode){if(!logs.length)return'<div class="empty">پس از ثبت حداقل یک جلسه، نمودار ظاهر می‌شود.</div>';const arr=logs.slice(-16),w=680,h=235,pad=35,x=i=>pad+i*(w-2*pad)/Math.max(1,arr.length-1), ymax=mode==='pain'?10:3,y=n=>h-pad-(h-2*pad)*(+n/ymax);const lines=mode==='pain'?[{k:'prePain',color:'#8eb1ee'},{k:'postPain',color:'#2b61da'}]:[{k:'postRight',color:'#2b61da'},{k:'postLeft',color:'#008c86'}];return'<svg class="chart" role="img" aria-label="نمودار علائم در جلسات اخیر" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+Array.from({length:5},(_,i)=>{const v=ymax*i/4;return'<line x1="'+pad+'" y1="'+y(v)+'" x2="'+(w-pad)+'" y2="'+y(v)+'" stroke="#e7ebf3" stroke-dasharray="4 4"/><text x="16" y="'+(y(v)+4)+'" font-size="10" fill="#8491a5">'+v.toFixed(v%1?1:0)+'</text>'}).join('')+lines.map(l=>{const points=arr.map((d,i)=>x(i)+','+y(d[l.k])).join(' ');return'<polyline fill="none" stroke="'+l.color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+points+'"/>'+arr.map((d,i)=>'<circle cx="'+x(i)+'" cy="'+y(d[l.k])+'" r="4.5" fill="'+l.color+'"><title>'+d.date+' : '+d[l.k]+'</title></circle>').join('')}).join('')+arr.filter((_,i)=>i===0||i===arr.length-1||i%Math.max(1,Math.ceil(arr.length/6))===0).map(d=>{let i=arr.indexOf(d);return'<text x="'+x(i)+'" y="'+(h-11)+'" text-anchor="middle" font-size="10" fill="#78859b">'+d.date.slice(5)+'</text>'}).join('')+'</svg>'}
function progressPage(){const logs=Object.values(D.logs).sort((a,b)=>a.date.localeCompare(b.date)),total=logs.filter(l=>l.type==='A'||l.type==='B').length,days=Object.keys(D.logs).length,pre=logs.filter(l=>l.type==='A'||l.type==='B');const weeks=Array.from({length:12},(_,i)=>pre.filter(l=>l.week===i+1).length);return head('پیشرفت و علائم','روند تمرین، درد و گزگز را کنار هم ببینید.','۱۲ هفته')+statsHtml()+`<div class="card section"><div class="section-head"><h2>روند علائم</h2><div class="toggle-row"><button class="tabbtn ${chartMode==='pain'?'active':''}" data-chart="pain">درد</button><button class="tabbtn ${chartMode==='numbness'?'active':''}" data-chart="numbness">گزگز دو دست</button></div></div>${polyChart(logs,chartMode)}<div class="legend"><span>${chartMode==='pain'?'درد بعد':'دست راست بعد'}</span><span>${chartMode==='pain'?'درد قبل':'دست چپ بعد'}</span></div><p class="muted tiny">نمودار توصیفی است و به‌تنهایی نشان‌دهنده بهبودی یا ایمنی برنامه نیست.</p></div><div class="card section"><div class="section-head"><h2>تعداد جلسات مقاومتی در هفته</h2><small>هدف: ۲ جلسه پس از تأیید تمرین</small></div>${weeks.map((n,i)=>'<div style="display:grid;grid-template-columns:70px 1fr 35px;align-items:center;gap:9px;margin:9px 0"><small class="muted">هفته '+(i+1)+'</small><div class="bar"><div style="width:'+Math.min(100,n/2*100)+'%"></div></div><small>'+n+' / ۲</small></div>').join('')}</div><div class="card section"><h2 style="font-size:16px">برای بررسی پیشرفت واقعی</h2><p class="muted">در کنار وزنه و تعداد جلسات، تعداد بیدارشدن‌های شبانه، مدت کار بدون درد با لپ‌تاپ و شدت علائم عصبی را پیگیری کنید. افزایش قدرت به‌تنهایی دلیل کاهش تماس دیسک با نخاع نیست.</p></div>`}
function settingsPage(){return head('تنظیمات و اطلاعات','شروع برنامه، یادداشت پزشک و پشتیبان‌گیری از همه داده‌ها.','ذخیره محلی')+`<div class="card section"><div class="section-head"><h2>اطلاعات برنامه</h2></div><div class="formgrid three"><div class="field"><label>نام نمایشی (اختیاری)</label><input data-setting="person" value="${esc(D.person)}" placeholder="نام"></div><div class="field"><label>تاریخ شروع ۱۲ هفته</label><input type="date" data-setting="startDate" value="${esc(D.startDate)}"></div><div class="field"><label>وزن فعلی، صرفاً جهت یادداشت (kg)</label><input type="number" id="weightEntry" min="20" max="300" step="0.1" placeholder="۶۳"></div></div><button class="btn small" data-save-weight>ثبت وزن در تاریخ امروز</button><p class="tiny muted">تغییر تاریخ شروع، شماره هفته برای جلسات جدید را تغییر می‌دهد؛ اطلاعات جلسات قبلی حذف نمی‌شود.</p><hr class="sep"><h2 style="font-size:16px">تأیید شرایط شروع تمرین با وزنه</h2><label class="checkline"><input type="checkbox" data-setting="doctorCheck" ${D.doctorCheck?'checked':''}><span>پس از MRI و بررسی علائم گزگز دوطرفه، ارزیابی حضوری مرتبط انجام شده و پزشک/فیزیوتراپیست ادامه تمرین مقاومتی سبک را مجاز دانسته است.</span></label><div class="field"><label>یادداشت پزشک / محدودیت‌ها</label><textarea data-setting="doctorNote" placeholder="مثلاً: حرکات با وزنه بالای سر ممنوع. تاریخ و نتیجه بررسی عصبی...">${esc(D.doctorNote)}</textarea></div><div class="notice" style="margin-top:12px">علامت‌زدن این گزینه در اپ تأیید پزشکی ایجاد نمی‌کند. اگر معاینه عصبی انجام نشده، آن را بدون تأیید واقعی فعال نکنید.</div></div><div class="card section"><div class="section-head"><h2>حریم خصوصی و نسخه پشتیبان</h2></div><p class="muted">وزنه‌ها، تاریخچه و علائم روی حافظه همین مرورگر ذخیره می‌شوند؛ هیچ حساب کاربری، سرور یا همگام‌سازی خودکاری وجود ندارد. در حالت ناشناس (Private) یا پس از پاک‌کردن داده‌های مرورگر ممکن است اطلاعات از دست برود.</p><div class="actionrow"><button class="btn primary" data-export>⬇ پشتیبان JSON</button><button class="btn" da document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-draft]'))updateField(t);if(t.matches('[data-setting]')){let k=t.dataset.setting;D[k]=t.type==='checkbox'?t.checked:t.value;persist();if(k==='startDate'){programWeek=weekOf(selectedDate);render()}else if(k==='doctorCheck')render()}if(t.id==='workDate'){selectedDate=t.value||isoToday();render()}if(t.id==='importFile'&&t.files[0]){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.version!==1||!obj.logs||!obj.drafts||typeof obj.logs!=='object')throw Error('ساختار نامعتبر');modal('بازیابی اطلاعات','<p>فایل معتبر به نظر می‌رسد. بازیابی تمام داده‌های فعلی را با اطلاعات فایل جایگزین خواهد کرد.</p>','<button class="btn" data-modal-close>انصراف</button><button class="btn primary" data-confirm-import>تأیید بازیابی</button>');window.__importData=obj}catch(err){toast('این فایل پشتیبان معتبر نیست.')}};reader.readAsText(t.files[0])}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-draft]'))updateField(t);if(t.matches('[data-setting]')&&t.type!=='date'&&t.type!=='checkbox'){D[t.dataset.setting]=t.value;persist()}if(t.matches('[data-set]')){const d=getDraft(),id=t.dataset.set,f=t.dataset.sfield;if(!d.sets[id])d.sets[id]={done:false,reps:'',weight:''};d.sets[id][f]=t.value;persist()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){navTo(b.dataset.nav);return}if(b.dataset.type){selectedType=b.dataset.type;render();return}if(b.dataset.week){programWeek=+b.dataset.week;render();return}if(b.dataset.planstart){selectedDate=plusDays(D.startDate,(programWeek-1)*7+(b.dataset.planstart==='B'?3:0));selectedType=b.dataset.planstart;navTo('today');return}if(b.dataset.calendar){selectedDate=b.dataset.calendar;selectedType='A';navTo('today');return}if(b.dataset.openLog){selectedDate=b.dataset.openLog;selectedType=b.dataset.logType;const key=keyFor(selectedDate,selectedType);if(D.logs[key])D.drafts[key]=JSON.parse(JSON.stringify(D.logs[key]));persist();navTo('today');return}if(b.dataset.toggleSet){const d=getDraft();if(isPaused(d)){toast('ابتدا علت تشدید علائم را بررسی کنید؛ ادامه ست‌ها متوقف است.');return}const id=b.dataset.toggleSet;if(!d.sets[id])d.sets[id]={done:false,reps:'',weight:''};d.sets[id].done=!d.sets[id].done;persist();b.classList.toggle('done',d.sets[id].done);b.textContent=d.sets[id].done?'✓':'○';b.setAttribute('aria-pressed',String(d.sets[id].done));const container=b.closest('.ex'),chip=container?.querySelector('.ex-tools .chip'),count=container?.querySelectorAll('.set-check.done').length,total=container?.querySelectorAll('.set-check').length;if(chip)chip.textContent=count+'/'+total+' ست';if(chip)chip.classList.toggle('good',count===total);updateSets();return}if(b.dataset.exdetail){const ex=E[b.dataset.exdetail];modal(ex.fa,'<div class="eyebrow">'+ex.en+' • '+ex.target+'</div><p>'+ex.notes+'</p><div class="notice">'+ex.caution+'</div><p><strong>جایگزین:</strong> '+ex.alternative+'</p><p class="tiny muted">استراحت '+ex.rest+' ثانیه. سرعت کنترل‌شده حدود ۲ ثانیه رفت و ۲–۳ ثانیه بازگشت. وزنه از سبک‌ترین مقدار بدون افزایش علائم شروع شود؛ از حبس نفس و تلاش تا ناتوانی بپرهیزید.</p>',(ex.video?'<a class="btn primary" target="_blank" rel="noopener noreferrer" href="'+ex.video+'">▶ تماشای ویدئو</a>':'')+'<button class="btn" data-modal-close>بستن</button>');return}if(b.hasAttribute('data-save')){saveSession();return}if(b.hasAttribute('data-reset-draft')){modal('پاک‌کردن پیش‌نویس؟','<p>تغییرات ذخیره‌نشده این جلسه پاک می‌شود. جلسه‌های ثبت‌شده در تاریخچه حذف نمی‌شوند.</p>','<button class="btn" data-modal-close>انصراف</button><button class="btn danger" data-confirm-reset>حذف پیش‌نویس</button>');return}if(b.hasAttribute('data-confirm-reset')){delete D.drafts[keyFor(selectedDate,selectedType)];persist();closeModal();render();return}if(b.hasAttribute('data-modal-close')){closeModal();return}if(b.hasAttribute('data-confirm-import')){D={...defaultData(),...window.__importData};persist();closeModal();render();toast('اطلاعات بازیابی شد.');return}if(b.hasAttribute('data-export')){downloadFile(JSON.stringify(D,null,2),'hamrah-tamrin-backup-'+isoToday()+'.json','application/json;charset=utf-8');return}if(b.hasAttribute('data-csv')){const cols=['date','type','week','done','total','prePain','postPain','preRight','postRight','preLeft','postLeft','sleepWakes','cardioMins','rpe','stop','note'],rows=[cols.join(',')];Object.values(D.logs).sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>rows.push(cols.map(k=>'"'+String(o[k]??'').replace(/"/g,'""')+'"').join(',')));downloadFile('\ufeff'+rows.join('\n'),'hamrah-tamrin-history-'+isoToday()+'.csv','text/csv;charset=utf-8');return}if(b.hasAttribute('data-import')){document.getElementById('importFile')?.click();return}if(b.hasAttribute('data-clear')){modal('حذف تمام اطلاعات؟','<p style="color:#a32a30">تمام جلسات، پیش‌نویس‌ها و یادداشت‌های محلی برای همیشه حذف می‌شوند. ابتدا پشتیبان تهیه کنید.</p>','<button class="btn" data-modal-close>انصراف</button><button class="btn danger" data-confirm-clear>حذف دائمی</button>');return}if(b.hasAttribute('data-confirm-clear')){D=defaultData();localStorage.removeItem(KEY);closeModal();selectedDate=isoToday();render();toast('داده‌های محلی حذف شدند.');return}if(b.hasAttribute('data-chart')){chartMode=b.dataset.chart;render();return}if(b.hasAttribute('data-save-weight')){const el=document.getElementById('weightEntry'),v=Number(el?.value);if(!Number.isFinite(v)||v<20||v>300){toast('وزن معتبر را وارد کنید.');return}D.weightHistory.push({date:isoToday(),weight:v});persist();toast('وزن ثبت شد.');if(el)el.value='';return}});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.classList.contains('modal-back'))closeModal()});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
